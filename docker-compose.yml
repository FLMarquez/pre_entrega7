services:
  redis:
    # El checkpointer de LangGraph (langgraph-checkpoint-redis) necesita los
    # módulos RedisJSON + RediSearch -> se usa Redis Stack, no redis:alpine.
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    profiles:
      - phoenix

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./app:/app/app

volumes:
  redis-data:
